<style>

{const q=new URLSearchParams(location.search).get('city');if(q){const i=CITIES.findIndex(c=>c[0].toLowerCase()===q.toLowerCase());if(i>=0)S.city=i}}

 if(di!=null){const t=rows[di];h+=`<div class="res"><h3>${mk(t)} ${dnm(di)}: ${t.n>=4?u('good for ','موزوں: '):t.n?u('possible for ','ممکن: '):u('not ideal for ','موزوں نہیں: ')}${nm}</h3>${t.n?bt+win(t):u('Main problem: ','بڑا مسئلہ: ')+(t.why?u(WHY[t.why][0],WHY[t.why][1]):di===0?u('not enough of today is left','آج کا وقت کافی نہیں بچا'):u('too little daylight','روشنی کے اوقات کم ہیں'))}</div>`}
 h+=`<div class="res"><h3>${u('Best day this week: ','اس ہفتے کا بہترین دن: ')}${best.n?dnm(best.i):u('none','کوئی نہیں')}</h3>${best.n?bt+win(best):u('Conditions are poor all week for this.','پورے ہفتے حالات سازگار نہیں۔')}</div><div class="res">${rows.map(r=>`<div>${mk(r)} <b>${dnm(r.i)}</b> · ${r.n?win(r):'—'}</div>`).join('')}</div>`;$('pr').innerHTML=h}
function parseAsk(q){q=q.toLowerCase();const A=[['hike',/hik|trek|trail/],['cricket',/cricket|football|match|sport|play/],['walk',/walk|jog|run|exercise/],['drive',/driv|trip|travel|road|journey/],['laundry',/laundry|clothes|dry/],['photo',/photo|sunset|sunrise|golden/],['picnic',/picnic|bbq|barbecue|outing/]],ak=(A.find(x=>x[1].test(q))||['walk'])[0],D=S.data.days,dw=d=>new Date(d.date+'T00:00:00Z').getUTCDay();let di=null;
 if(/today|tonight/.test(q))di=0;else if(/tomorrow/.test(q))di=1;else{const m=q.match(/\b(sun|mon|tue|wed|thu|fri|sat)(?:day|sday|nesday|rsday|urday)?\b/);if(m)di=D.findIndex(d=>dw(d)===['sun','mon','tue','wed','thu','fri','sat'].indexOf(m[1]));else if(/weekend/.test(q))di=D.findIndex(d=>dw(d)===6)}
 return[ak,di<0?null:di]}
function plan(){const D=S.data,T=u('Plan my day','میرا دن پلان کریں');
 if(!D||D.est||!(D.days[0].p||[]).length)return openPanel(T,`<div class="res">${u('Plan my day needs a saved or live forecast. Connect to the internet once and try again.','اس کے لیے ایک بار انٹرنیٹ سے موسم لوڈ ہونا ضروری ہے۔')}</div>`);
 openPanel(T,`<input class="q" id="pq" placeholder="${u('Ask: Should I go hiking on Saturday?','پوچھیں: کیا ہفتے کو ہائیکنگ ٹھیک رہے گی؟')}" enterkeyhint="go"><div class="chips">${Object.keys(ACT).map(k=>`<button data-k="${k}">${u(ACT[k].n[0],ACT[k].n[1])}</button>`).join('')}</div><div id="pr"></div>`);
 $('pBody').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{$('pBody').querySelectorAll('[data-k]').forEach(x=>x.classList.toggle('on',x===b));showPlan(b.dataset.k,null)});
 $('pq').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){const[k,d]=parseAsk(e.target.value);$('pBody').querySelectorAll('[data-k]').forEach(x=>x.classList.toggle('on',x.dataset.k===k));showPlan(k,d)}}}
/* ---------- alerts ---------- */
const alOn=()=>{try{return localStorage.getItem('al')==='1'&&'Notification'in window&&Notification.permission==='granted'}catch(e){return 0}};
async function syncAlerts(){try{const r=await navigator.serviceWorker.ready,c=CITIES[S.city];r.active&&r.active.postMessage({type:'city',c:[c[0],c[2],c[3]]});if(r.periodicSync){if(alOn())await r.periodicSync.register('wx',{minInterval:12*36e5});else await r.periodicSync.unregister('wx')}}catch(e){}}
function notifyNow(){if(!alOn()||!S.al||!S.al.length||S.sel||!S.data||S.data.est)return;const k='n:'+new Date().toDateString()+KEY(CITIES[S.city]);try{if(localStorage.getItem(k))return;localStorage.setItem(k,1)}catch(e){}navigator.serviceWorker.ready.then(r=>r.showNotification('Aasmaan · '+CITIES[S.city][0],{body:S.al.join(' '),icon:'icon-192.png',badge:'icon-192.png',tag:'wx'})).catch(()=>{});syncAlerts()}
function alerts(){const on=alOn();
 openPanel(u('Weather alerts','موسمی الرٹس'),`<div class="res"><h3>${on?u('Alerts are on','الرٹس آن ہیں'):u('Get warned before it happens','موسم بگڑنے سے پہلے خبردار ہوں')}</h3>${u('Heat of 40°C or more, rain of 60% or more, heavy rain and flood risk, dense fog, strong winds, very high UV and freezing nights.','40°C یا زیادہ گرمی، 60% یا زیادہ بارش کا امکان، موسلا دھار بارش اور سیلاب کا خطرہ، گہری دھند، تیز ہوائیں، بہت زیادہ یو وی اور یخ بستہ راتیں۔')}</div><button class="loc" id="at" style="margin-top:12px">${on?u('Turn off alerts','الرٹس بند کریں'):u('Turn on alerts','الرٹس آن کریں')}</button><p class="note">${u('Alerts are checked when you open the app. On Android, once installed, your phone may also check in the background about twice a day. iPhone and some browsers only support checks while the app is open.','ایپ کھولنے پر الرٹس چیک ہوتے ہیں۔ اینڈرائیڈ پر انسٹال کرنے کے بعد فون دن میں تقریباً دو بار بیک گراؤنڈ میں بھی چیک کر سکتا ہے۔ آئی فون اور کچھ براؤزرز صرف ایپ کھلی ہونے پر چیک کرتے ہیں۔')}</p>`);
 $('at').onclick=async()=>{if(on){try{localStorage.setItem('al','0')}catch(e){}await syncAlerts();return alerts()}
  if(!('Notification'in window))return toast(u('Notifications are not supported here','یہاں نوٹیفکیشن دستیاب نہیں'));
  const p=await Notification.requestPermission();if(p!=='granted')return toast(u('Permission was not given','اجازت نہیں دی گئی'));try{localStorage.setItem('al','1')}catch(e){}await syncAlerts();toast(u('Alerts are on','الرٹس آن ہیں'));alerts();notifyNow()}}
/* ---------- boot ---------- */
const _render=render;render=function(a){_render(a);if(L==='ur')applyLang();notifyNow();histKick()};
$('toolsBtn').onclick=menu;
if(L==='ur')applyLang();
boot();
if(/open=map/.test(location.search))setTimeout(rainMap,2500);
